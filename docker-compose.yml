services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traffic}
      POSTGRES_USER: ${POSTGRES_USER:-traffic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traffic-dev-only}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traffic} -d ${POSTGRES_DB:-traffic}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend_a:
    build: ./backends
    environment:
      SERVICE_NAME: backend-a
      DEFAULT_DELAY_MS: ${BACKEND_A_DELAY_MS:-25}
      ERROR_RATE: ${BACKEND_A_ERROR_RATE:-0}
    ports: ["8001:8001"]
    command: ["uvicorn", "service.app:app", "--host", "0.0.0.0", "--port", "8001"]
  backend_b:
    build: ./backends
    environment:
      SERVICE_NAME: backend-b
      DEFAULT_DELAY_MS: ${BACKEND_B_DELAY_MS:-75}
      ERROR_RATE: ${BACKEND_B_ERROR_RATE:-0}
    ports: ["8002:8002"]
    command: ["uvicorn", "service.app:app", "--host", "0.0.0.0", "--port", "8002"]
  gateway:
    build: ./gateway
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://traffic:traffic-dev-only@postgres:5432/traffic}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-secret}
    ports: ["${GATEWAY_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend_a: {condition: service_started}
      backend_b: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  event_worker:
    build: ./gateway
    command: ["python", "-m", "app.event_worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://traffic:traffic-dev-only@postgres:5432/traffic}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      gateway: {condition: service_healthy}
  control_plane:
    build: ./control_plane
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://traffic:traffic-dev-only@postgres:5432/traffic}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-token-change-me}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-secret}
    ports: ["8010:8010"]
    depends_on:
      gateway: {condition: service_healthy}
  ml_service:
    build: ./ml_service
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://traffic:traffic-dev-only@postgres:5432/traffic}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MODEL_PATH: /models/isolation_forest.joblib
    volumes: ["ml_models:/models"]
    ports: ["8020:8020"]
    depends_on:
      gateway: {condition: service_healthy}
  policy_engine:
    build: ./policy_engine
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://traffic:traffic-dev-only@postgres:5432/traffic}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      BLOCK_TTL_SECONDS: ${BLOCK_TTL_SECONDS:-120}
      LATENCY_TARGET_MS: ${LATENCY_TARGET_MS:-250}
    depends_on:
      ml_service: {condition: service_started}
  dashboard:
    build: ./dashboard
    ports: ["3001:80"]
    depends_on: [control_plane]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [gateway]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
volumes:
  postgres_data:
  redis_data:
  grafana_data:
  ml_models:
